name: Circuit Bridge data probe
on:
  workflow_dispatch:
  push:
    branches: ['research/circuit-bridge-fork-seed']
    paths: ['.github/workflows/circuit-bridge-data-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pyarrow==19.0.1 pandas==2.2.3 numpy==2.2.6
      - name: Compare official annotation populations with upstream lock
        run: |
          mkdir -p work/probe
          python - <<'PY'
          import hashlib, io, json, pathlib, urllib.request
          import pandas as pd
          import numpy as np
          base='https://storage.googleapis.com/flyem-male-cns/v1.0/connectome-data/flat-connectome/'
          name='body-annotations-male-cns-v1.0-minconf-0.5.feather'
          with urllib.request.urlopen(base+name,timeout=90) as response:
              data=response.read(50_000_001)
              generation=response.headers.get('x-goog-generation')
          assert len(data)<=50_000_000
          assert hashlib.sha256(data).hexdigest()=='2177e246113e4cfbf1e7772ec37c6da1955ff22e8063d0b1f833101f99a9a3b2'
          df=pd.read_feather(io.BytesIO(data))
          lock=json.loads(pathlib.Path('organism_core/graph_lock.json').read_text())
          result={'dataset':'male-cns:v1.0','annotation_sha256':hashlib.sha256(data).hexdigest(),'generation':generation,'source_commit':__import__('os').environ['GITHUB_SHA'],'status_counts':df['status'].fillna('<null>').value_counts().to_dict(),'status_label_counts':df['statusLabel'].astype(str).value_counts().to_dict(),'populations':{}}
          for label, mask in [('all',np.ones(len(df),dtype=bool)),('status_Traced',df['status'].eq('Traced')),('type_present',df['type'].notna()),('superclass_present',df['superclass'].notna())]:
              sub=df.loc[mask]; ids=np.sort(sub['bodyId'].to_numpy(dtype=np.int64))
              buf=io.BytesIO(); np.save(buf,ids,allow_pickle=False)
              digest=hashlib.sha256(buf.getvalue()).hexdigest()
              result['populations'][label]={'rows':len(ids),'ids_sha256':digest,'matches_upstream_ids':digest==lock['files']['body_ids.npy'],'superclasses':sub['superclass'].fillna('<null>').value_counts().to_dict(),'DNge104':json.loads(sub.loc[sub['type'].eq('DNge104'),['bodyId','type','status','superclass']].to_json(orient='records'))}
          text=json.dumps(result,indent=2)
          pathlib.Path('work/probe/population.json').write_text(text)
          print(text)
          PY
          git archive HEAD -o work/probe/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-bridge-population-probe
          path: work/probe/
          retention-days: 14
