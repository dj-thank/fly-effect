name: Core checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,neural]"
      - run: python -m pytest -q --junitxml=work/validation/junit.xml
      - run: python scripts/check_experiment.py examples/experiment.json
      - run: python scripts/audit_release.py
      - run: python -m build
      - name: Retain test evidence even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: work/validation/
          if-no-files-found: error
          retention-days: 14
      - name: Retain distributions for independent inspection
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: validated-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
