name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,neural,mechanics]"
      - run: python -m pytest -q --junitxml=work/validation/junit.xml
      - run: fly-effect mechanics-demo --out work/validation/mechanics
      - run: python scripts/audit_release.py
      - run: python -m build
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-evidence-${{ matrix.os }}-py${{ matrix.python }}
          path: work/validation/
          if-no-files-found: warn
          retention-days: 14
      - name: Retain distributions for independent validation
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: validated-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
  body-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      FLY_EFFECT_HOME: ${{ github.workspace }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[body]"
      - run: fly-effect doctor
      - name: Probe every leg without a neural dataset
        shell: bash
        run: |
          failed=0
          for leg in lf lm lh rf rm rh; do
            fly-effect calibrate-body --out "work/body-probe/$leg" --leg "$leg" --duration 0.02 --wall-limit 120 || failed=1
          done
          exit "$failed"
      - name: Retain mechanical evidence including failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-leg-body-probe
          path: work/body-probe/
          if-no-files-found: warn
          retention-days: 14
