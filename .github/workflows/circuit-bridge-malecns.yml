name: Circuit Bridge real MaleCNS
on:
  push:
    branches: [research/circuit-bridge-fork-seed, research/circuit-bridge-certified]
    paths:
      - research/circuit_bridge/**
      - tests/circuit_bridge/**
      - .github/workflows/circuit-bridge-malecns.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: circuit-bridge-malecns-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 pytest==8.4.2
      - run: python -m compileall -q research/circuit_bridge
      - run: python -m pytest tests/circuit_bridge -q
  experiment:
    needs: tests
    if: contains(fromJSON('["refs/heads/research/circuit-bridge-fork-seed","refs/heads/research/circuit-bridge-certified"]'), github.ref) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 pyarrow==19.0.1
      - name: Full graph acquisition and held-out interventions
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/malecns" work/real-data
          python -m research.circuit_bridge.benchmark --data "$RUNNER_TEMP/malecns" --out work/real-data/result.json --gains 0.5 0.8 0.95 2>&1 | tee work/real-data/experiment.log
          python -c "import json; assert json.load(open('work/real-data/result.json'))['status']=='complete'"
      - name: Record checked-out source and compact audit evidence
        if: always()
        run: |
          mkdir -p work/real-data
          git rev-parse HEAD > work/real-data/source-commit.txt
          git archive HEAD -o work/real-data/source.zip
          python - <<'PY'
          import os, pathlib, shutil, json
          src = pathlib.Path(os.environ['RUNNER_TEMP']) / 'malecns'
          dst = pathlib.Path('work/real-data')
          for name in ('schema.json', 'source-manifest.json', 'graph-audit.json'):
              if (src/name).is_file(): shutil.copy2(src/name, dst/name)
          (dst/'execution.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'], 'actions_run_id':os.environ['GITHUB_RUN_ID'], 'result_present':(dst/'result.json').exists()},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-bridge-real-malecns
          path: work/real-data/
          retention-days: 14
