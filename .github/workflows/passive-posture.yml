name: FE-02 passive posture equilibrium
on:
  pull_request:
    paths:
      - 'organism_core/**'
      - 'scripts/**'
      - 'tests/**'
      - 'transfer*_tendons.py'
      - 'audit_source_tendons.py'
      - 'pyproject.toml'
      - 'examples/fe02-passive-posture.json'
      - 'examples/fe02-passive-margin.json'
      - 'examples/fe02-posture-shift.json'
      - 'examples/fe02-iterative-shift.json'
      - '.github/workflows/passive-posture.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passive-posture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  passive-posture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[body,mechanics]"
      - name: Reproduce the bounded placement workspace
        run: python scripts/run_foot_placement_study.py --workspace work/foot-placement
      - name: Reverify inputs and isolate passive-load conflicts
        timeout-minutes: 3
        # Context diagnostic only; the posture search re-verifies its own
        # inputs. A borderline-LP receipt is kept as evidence, never a blocker.
        continue-on-error: true
        run: python -m organism_core.support_conflict --workspace work/foot-placement
      - name: Bounded passive-posture equilibrium search
        timeout-minutes: 22
        env:
          FLY_EFFECT_HOME: ${{ github.workspace }}/work/foot-placement
        run: python -m organism_core.passive_posture --workspace work/foot-placement
      - name: Replay saved LP evidence without physics
        timeout-minutes: 8
        run: python -m organism_core.passive_posture --workspace work/foot-placement --verify
      - name: Measure the combined passive-authority margin on saved witnesses
        timeout-minutes: 8
        run: python -m organism_core.passive_margin --workspace work/foot-placement
      - name: Replay every margin LP from saved arrays
        timeout-minutes: 8
        run: python -m organism_core.passive_margin --workspace work/foot-placement --verify
      - name: Evaluate the gate chain at margin-directed shifted postures
        timeout-minutes: 12
        run: python -m organism_core.posture_shift --workspace work/foot-placement
      - name: Replay every shifted-trial gate from saved arrays
        timeout-minutes: 8
        run: python -m organism_core.posture_shift --workspace work/foot-placement --verify
      - name: Iterate margin-directed shifts from the best seeds
        timeout-minutes: 18
        run: python -m organism_core.iterative_shift --workspace work/foot-placement
      - name: Replay the iterate chain and every saved LP
        timeout-minutes: 8
        run: python -m organism_core.iterative_shift --workspace work/foot-placement --verify
      - name: Retain raw evidence and failures, never meshes or XML assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fe02-passive-posture-evidence
          retention-days: 14
          if-no-files-found: error
          path: |
            work/foot-placement/*.json
            work/foot-placement/*.log
            work/foot-placement/passive-posture/*.json
            work/foot-placement/passive-posture/*.npz
            work/foot-placement/passive-margin/*.json
            work/foot-placement/passive-margin/*.npz
            work/foot-placement/posture-shift/*.json
            work/foot-placement/posture-shift/*.npz
            work/foot-placement/iterative-shift/*.json
            work/foot-placement/iterative-shift/*.npz
            work/foot-placement/foot-placement/*.json
            work/foot-placement/passive-conflict/*.json
            work/foot-placement/source-study/*.json
            work/foot-placement/runs/source-tendon-audit/results.json
            work/foot-placement/runs/six-leg-tendon-candidate/results.json
