name: Circuit bridge checks
on:
  push:
    branches: ['research/circuit-bridge*']
  pull_request:
    paths: ['research/circuit_bridge/**', 'tests/circuit_bridge/**', '.github/workflows/circuit-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  circuit-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy==2.2.6 scipy==1.15.3 pandas==2.2.3 pytest==8.4.2
      - run: python -m compileall -q research/circuit_bridge
      - run: python -m pytest tests/circuit_bridge -q --junitxml=work/bridge-tests.xml
      - run: python -m research.circuit_bridge --out work/bridge-demo --steps 400 --seeds 0 1 2
      - name: Record checked-out code and version
        if: always()
        run: |
          mkdir -p work
          git rev-parse HEAD > work/source-commit.txt
          git archive HEAD -o work/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circuit-bridge-${{ matrix.python }}
          path: work/
          retention-days: 14
