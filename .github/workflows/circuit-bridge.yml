name: Circuit bridge checks
on:
  push:
    branches: ['research/circuit-bridge*']
  pull_request:
    paths: ['research/circuit_bridge/**', 'tests/circuit_bridge/**', '.github/workflows/circuit-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'pytest>=8,<10'
      - run: python -m pytest tests/circuit_bridge -q --junitxml=work/bridge-tests.xml
      - run: python -m research.circuit_bridge --out work/bridge-demo --steps 400 --seeds 0 1 2
      - uses: actions/upload-artifact@v4
        with:
          name: circuit-bridge-${{ matrix.python }}
          path: work/
