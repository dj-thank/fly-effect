[build-system]
requires = ["setuptools>=77,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-effect"
version = "0.1.0a0"
description = "Open, resource-aware research on neural circuits, bodies, and simulated organisms"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Fly Effect contributors"}]
dependencies = ["numpy==2.2.6"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]
neural = ["brian2==2.8.0"]
mechanics = ["mujoco==3.9.0"]
# The pinned FlyGym body backend requires Python >=3.12,<3.15.
body = ["mujoco==3.9.0", "flygym @ git+https://github.com/NeLy-EPFL/flygym.git@38c8ec61034cd59bc5ba0de20688d4a3c0000d60"]
simulation = ["brian2==2.8.0", "mujoco==3.9.0", "pandas==2.3.3", "pyarrow==23.0.1", "scipy==1.15.3", "psutil==7.2.2", "flygym @ git+https://github.com/NeLy-EPFL/flygym.git@38c8ec61034cd59bc5ba0de20688d4a3c0000d60"]

[project.scripts]
fly-effect = "fly_effect:main"
fly-effect-organism = "organism:main"

[tool.setuptools]
packages = ["organism_core"]
py-modules = ["fly_effect", "organism"]

[tool.setuptools.package-data]
organism_core = ["graph_lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/simulation"]
